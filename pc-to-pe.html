<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PC 转 PE 转换器</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="app-shell">
        <nav class="global-toolbar" aria-label="全局工具">
            <a class="button secondary global-tool-button" href="./index.html">返回编辑器</a>
        </nav>

        <header class="hero hero-single">
            <div class="hero-copy">
                <p class="eyebrow">BetterAppearance PC To PE</p>
                <h1>PC 转 PE 转换器</h1>
                <p class="hero-text">
                    独立转换 PC 玩家动作和 PC 时装资源，生成 PE 可用文件，并打包为 ZIP 下载。
                </p>
            </div>
        </header>

        <section class="status-strip">
            <div class="status-block">
                <span class="status-label">转换类型</span>
                <strong id="converterTypeText">PC 玩家动作转 PE 玩家动作</strong>
            </div>
            <div class="status-block">
                <span class="status-label">当前状态</span>
                <strong id="converterStatusText">等待选择 PC 动作文件。</strong>
            </div>
        </section>

        <main class="converter-workspace">
            <div id="converterRoot"></div>
        </main>
    </div>

    <input id="pcActionInput" type="file" multiple accept=".json,.animation.json" hidden>
    <input id="pcCostumeInput" type="file" multiple accept=".png,.json,.geo.json,.animation.json" hidden>

    <script src="./vendor/jszip.min.js"></script>
    <script src="./vendor/pinyin-pro.js"></script>
    <script src="./pc-to-pe-core.js"></script>
    <script src="./pc-to-pe.js"></script>
</body>
</html>
